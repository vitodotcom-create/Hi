name: Panel preview

# Снимок экрана панели в эмуляторе (без установки в машину). Запуск вручную.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build panel
        run: gradle :panel:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 900x780
            adb shell wm density 240
            adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
            sleep 5
            adb install -r panel/build/outputs/apk/debug/panel-debug.apk
            adb shell am start -n com.carvoice.panel/.PanelActivity
            sleep 12
            adb exec-out screencap -p > panel-preview.png
            adb shell input keyevent KEYCODE_TAB
            sleep 2
            adb exec-out screencap -p > panel-preview-focus.png

      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-preview-${{ github.run_number }}
          name: Panel preview ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            panel-preview.png
            panel-preview-focus.png
