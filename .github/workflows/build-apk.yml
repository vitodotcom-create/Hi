name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Каждая сборка — ТЕСТОВАЯ (pre-release). Ссылка releases/latest остаётся на стабильной версии.
  build:
    if: "!contains(github.event.head_commit.message, '[promote]') && !contains(github.event.head_commit.message, '[preview]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug :panel:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CarVoice.apk
          cp panel/build/outputs/apk/debug/panel-debug.apk CarVoicePanel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarVoice-apk
          path: |
            CarVoice.apk
            CarVoicePanel.apk

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: CarVoice 0.1.${{ github.run_number }} (тест)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            CarVoice.apk
            CarVoicePanel.apk
          body: |
            🧪 Тестовая сборка из коммита ${{ github.sha }}.
            CarVoice: https://github.com/${{ github.repository }}/releases/download/v0.1.${{ github.run_number }}/CarVoice.apk
            Панель: https://github.com/${{ github.repository }}/releases/download/v0.1.${{ github.run_number }}/CarVoicePanel.apk
            Стабильная версия всегда здесь: https://github.com/${{ github.repository }}/releases/latest/download/CarVoice.apk

  # Стабильная версия = тег из файла STABLE_VERSION. Меняется коммитом с пометкой [promote].
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d '[:space:]' < STABLE_VERSION)
          echo "Stable: $TAG"
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --prerelease=false --latest \
            --title "CarVoice ${TAG#v} (стабильная)"

  # Снимок экрана панели в эмуляторе (коммит с пометкой [preview]) — без новой версии.
  preview:
    if: "!contains(github.event.head_commit.message, '[promote]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build panel
        run: gradle :panel:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 900x780
            adb shell wm density 240
            adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
            sleep 5
            adb install -r panel/build/outputs/apk/debug/panel-debug.apk
            adb shell am start -n com.carvoice.panel/.PanelActivity
            sleep 12
            adb exec-out screencap -p > panel-preview.png
            adb shell input keyevent KEYCODE_TAB
            sleep 2
            adb exec-out screencap -p > panel-preview-focus.png

      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-preview-${{ github.run_number }}
          name: Panel preview ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            panel-preview.png
            panel-preview-focus.png
