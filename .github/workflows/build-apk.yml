name: Build APK

on:
  push:
    # Сборка только из рабочей ветки; main — копия для новых разговоров.
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Каждая сборка — ТЕСТОВАЯ (pre-release). Ссылка releases/latest остаётся на стабильной версии.
  build:
    if: "!contains(github.event.head_commit.message, '[promote]') && !contains(github.event.head_commit.message, '[preview]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug :panel:assembleDebug :desktop:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CarVoice.apk
          cp panel/build/outputs/apk/debug/panel-debug.apk CarVoicePanel.apk
          cp desktop/build/outputs/apk/debug/desktop-debug.apk CarVoiceDesktop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarVoice-apk
          path: |
            CarVoice.apk
            CarVoicePanel.apk
            CarVoiceDesktop.apk

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: CarVoice 0.1.${{ github.run_number }} (тест)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            CarVoice.apk
            CarVoicePanel.apk
            CarVoiceDesktop.apk
          body: |
            🧪 Тестовая сборка из коммита ${{ github.sha }}.
            CarVoice: https://github.com/${{ github.repository }}/releases/download/v0.1.${{ github.run_number }}/CarVoice.apk
            Панель: https://github.com/${{ github.repository }}/releases/download/v0.1.${{ github.run_number }}/CarVoicePanel.apk
            Стабильная версия всегда здесь: https://github.com/${{ github.repository }}/releases/latest/download/CarVoice.apk

  # Стабильная версия = тег из файла STABLE_VERSION. Меняется коммитом с пометкой [promote].
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d '[:space:]' < STABLE_VERSION)
          echo "Stable: $TAG"
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --prerelease=false --latest \
            --title "CarVoice ${TAG#v} (стабильная)"

  # Снимок экрана панели в эмуляторе — только для коммита с пометкой [preview].
  preview:
    if: "contains(github.event.head_commit.message, '[preview]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build panel
        run: gradle :panel:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot in emulator
        continue-on-error: true
        timeout-minutes: 15
        run: |
          SDK=$ANDROID_HOME
          IMG="system-images;android-33;google_apis;x86_64"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --install "$IMG" "emulator" "platform-tools" > sdk.log 2>&1 || true
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          ls $SDK/system-images/android-33/google_apis/ >> sdk.log 2>&1 || echo "no image" >> sdk.log
          echo no | $SDK/cmdline-tools/latest/bin/avdmanager create avd -n preview -k "$IMG" -d pixel_5 --force > avd.log 2>&1 || true
          $SDK/emulator/emulator -list-avds >> avd.log 2>&1
          # Мало места на диске раннера: маленький раздел данных + чистка лишнего.
          sed -i '/disk.dataPartition.size/d' $ANDROID_AVD_HOME/preview.avd/config.ini
          echo "disk.dataPartition.size=2G" >> $ANDROID_AVD_HOME/preview.avd/config.ini
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
          df -h $HOME >> avd.log
          nohup $SDK/emulator/emulator -avd preview -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          ADB=$SDK/platform-tools/adb
          timeout 600 $ADB wait-for-device
          until [ "$($ADB shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 3; done
          $ADB shell wm size 900x780
          $ADB shell wm density 240
          $ADB shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
          sleep 8
          $ADB install -r panel/build/outputs/apk/debug/panel-debug.apk
          $ADB shell am start -n com.carvoice.panel/.PanelActivity
          sleep 12
          $ADB exec-out screencap -p > panel-preview.png
          $ADB shell input keyevent KEYCODE_TAB
          sleep 2
          $ADB exec-out screencap -p > panel-preview-focus.png
          $ADB logcat -d -t 300 > logcat.txt || true

      - name: Publish preview
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-preview-${{ github.run_number }}
          name: Panel preview ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: false
          files: |
            panel-preview.png
            panel-preview-focus.png
            emulator.log
            logcat.txt
            sdk.log
            avd.log
